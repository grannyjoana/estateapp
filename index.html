<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>地產S牌通 2026</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --accent: #38bdf8;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Layout & Responsive Sidebar */
    #app-container { display: flex; flex: 1; flex-direction: column; height: 100%; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    
    /* 導航欄 Mobile First (Bottom Bar) */
    nav {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      order: 2;
    }
    
    nav button {
      background: none; border: none; color: var(--text-muted); font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;
    }
    nav button.active { color: var(--accent); font-weight: bold; }

    /* 主內容區域 */
    main { flex: 1; overflow-y: auto; padding: 16px; order: 1; }

    /* 橫屏 (Landscape) 自動變身為左側側欄 */
    @media (orientation: landscape) {
      #app-container { flex-direction: row; }
      nav {
        flex-direction: column;
        justify-content: flex-start;
        width: 200px;
        border-top: none;
        border-right: 1px solid var(--border);
        order: 1;
        padding-top: 20px;
        gap: 12px;
      }
      nav button { flex-direction: row; justify-content: flex-start; padding: 10px 16px; width: 100%; font-size: 0.9rem; }
      main { order: 2; }
    }

    /* UI Cards */
    .card { background: var(--bg-card); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
    .card-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .card-value { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
    .badge-e { background: #d97706; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
    
    .btn { background: var(--accent); color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 8px; cursor: pointer; }
    .btn-danger { background: var(--danger); color: white; }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 內容渲染區 -->
  <main id="main-content">
    <!-- 動態 JS 載入頁面內容 -->
  </main>

  <!-- 導航選單 -->
  <nav id="nav-bar">
    <button onclick="switchTab('home')" class="active">🏠 <span>主頁</span></button>
    <button onclick="switchTab('notes')">📚 <span>筆記小測</span></button>
    <button onclick="switchTab('special')">📑 <span>專項練習</span></button>
    <button onclick="switchTab('exam')">⏱️ <span>模擬試</span></button>
    <button onclick="switchTab('progress')">📊 <span>進度</span></button>
    <button onclick="switchTab('docs')">📁 <span>我的資料</span></button>
    <button onclick="switchTab('official')">🌐 <span>官方入口</span></button>
  </nav>
</div>

<script>
  // 核心數據結構 (localStorage 機制)
  const Store = {
    getExamDate: () => localStorage.getItem('exam_date') || '2026-10-21',
    setExamDate: (date) => localStorage.setItem('exam_date', date),
    getWrongQuestions: () => JSON.parse(localStorage.getItem('wrong_q') || '[]'),
  };

  // 頁面路由分發器
  function switchTab(tabName) {
    document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
    event.currentTarget.classList.add('active');
    
    const main = document.getElementById('main-content');
    
    switch(tabName) {
      case 'home':
        renderHome(main);
        break;
      case 'notes':
        renderNotes(main);
        break;
      case 'exam':
        renderExamMenu(main);
        break;
      case 'official':
        renderOfficialLinks(main);
        break;
      default:
        main.innerHTML = `<div class="card"><div class="card-title">頁面建設中</div><h3>${tabName.toUpperCase()} 模組即將開放</h3></div>`;
    }
  }

  // 1. 主頁 Render
  function renderHome(container) {
    const examDate = new Date(Store.getExamDate());
    const today = new Date();
    const diffDays = Math.ceil((examDate - today) / (1000 * 60 * 60 * 24));
    
    container.innerHTML = `
      <div class="card">
        <div class="card-title">🎯 2026 S牌考試倒數</div>
        <div class="card-value">${diffDays > 0 ? diffDays : 0} 天</div>
        <input type="date" value="${Store.getExamDate()}" onchange="Store.setExamDate(this.value); renderHome(document.getElementById('main-content'))" style="margin-top:8px; background:#0f172a; color:#fff; border:1px solid #334155; padding:4px 8px; border-radius:4px;">
      </div>

      <div class="card" style="border-left: 4px solid var(--danger);">
        <div class="card-title">⚠️ 個案容錯警告 (10題個案題)</div>
        <div style="font-size:0.95rem; margin-top:4px;">合共 10 題：錯 5 題即不合格！現時容錯剩餘：<strong style="color:var(--danger)">4 題</strong></div>
      </div>

      <div class="card">
        <div class="card-title">📉 最弱範疇</div>
        <div style="font-size:1.1rem; font-weight:bold; margin-top:4px; color:#f59e0b;">第 511 章《地產代理條例》 (正確率 42%)</div>
      </div>

      <button class="btn" onclick="switchTab('exam')">▶️ 繼續未做完的模擬卷</button>
    `;
  }

  // 2. 筆記小測 Render (包含 E 牌標記避坑)
  function renderNotes(container) {
    const chapters = [
      { id: 1, name: "第1–5章 行業簡介與條例背景", count: 12 },
      { id: 511, name: "第511章《地產代理條例》", count: 25 },
      { id: 6, name: "第6章 估價基礎", isE: true },
      { id: 7, name: "第7章 租契與租約法例", count: 18 },
      { id: 8, name: "第8章 管理營業員職能", isE: true }
    ];

    let html = `<h2>六大範疇短筆記 & 小測</h2><br>`;
    chapters.forEach(ch => {
      if(ch.isE) {
        html += `
          <div class="card" style="opacity: 0.5;">
            <div style="display:flex; justify-size:space-between; align-items:center;">
              <span>${ch.name}</span>
              <span class="badge-e">E 牌專用 (已屏蔽練習)</span>
            </div>
          </div>`;
      } else {
        html += `
          <div class="card">
            <h3>${ch.name}</h3>
            <p style="font-size:0.8rem; color:var(--text-muted); margin: 6px 0;">內含約 ${ch.count} 條核心小測題</p>
            <button class="btn" style="width:auto; font-size:0.8rem; padding:6px 12px;">開始溫習 & 小測</button>
          </div>`;
      }
    });
    container.innerHTML = html;
  }

  // 4. 模擬試三種模式入口
  function renderExamMenu(container) {
    container.innerHTML = `
      <h2>模擬考試模式</h2><br>
      <div class="card">
        <h3>1. 全卷計時模擬試 (真實合格線)</h3>
        <p style="font-size:0.85rem; color:var(--text-muted); margin: 8px 0;">40題單選 + 10題個案 (合共 150 分鐘)。交卷後方可對答案。</p>
        <button class="btn" onclick="startExam('full')">開始全卷考試</button>
      </div>

      <div class="card" style="border-left: 4px solid var(--danger);">
        <h3>2. 個案專練 (斷頭台機制)</h3>
        <p style="font-size:0.85rem; color:var(--text-muted); margin: 8px 0;">精選 10 題個案題。<strong>錯 5 題即時判定不合格並中斷！</strong></p>
        <button class="btn btn-danger" onclick="startExam('case')">挑戰個案極限</button>
      </div>

      <div class="card">
        <h3>3. 錯題重溫專練</h3>
        <p style="font-size:0.85rem; color:var(--text-muted); margin: 8px 0;">目前錯題庫累積：${Store.getWrongQuestions().length} 題</p>
        <button class="btn" style="background:#10b981; color:white;" onclick="startExam('wrong')">溫習錯題</button>
      </div>
    `;
  }

  // 7. 官方外鏈 (離線預留 & 在線跳轉)
  function renderOfficialLinks(container) {
    container.innerHTML = `
      <h2>官方參考入口 (須聯網)</h2><br>
      <div class="card">
        <a href="https://www.eaa.org.hk/practice/documents/codeofethics.pdf" target="_blank" style="color:var(--accent); text-decoration:none; font-weight:bold;">📄 《操守守則》PDF 直達</a>
      </div>
      <div class="card">
        <a href="https://www.eaa.org.hk/zh-hk/Compliance/Practice-circulars" target="_blank" style="color:var(--accent); text-decoration:none; font-weight:bold;">🌐 EAA 執業通告目錄 (HTML)</a>
      </div>
      <div class="card">
        <a href="http://www.eaa.org.hk/Portals/0/Sections/Exam/2015/Sample%20Question/Sample%20Questions_C.pdf" target="_blank" style="color:var(--accent); text-decoration:none; font-weight:bold;">📄 官方參考題目 Sample Questions PDF</a>
      </div>
    `;
  }

  // 初始化載入主頁
  renderHome(document.getElementById('main-content'));

  // Service Worker 註冊 (離線 App 支持)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW register failed', err));
  }
</script>
</body>
</html>
